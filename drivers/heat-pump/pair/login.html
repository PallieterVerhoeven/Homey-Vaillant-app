<!DOCTYPE html>
<html>
<head>
</head>
<body>
<header class="homey-header">
    <img src="../../../assets/images/vaillant-logo.png" alt="Vaillant" id="logo"
         style="width: 100%; max-width: 200px; margin: 0 auto; display: block;">
</header>

<fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" id="legend">Login with your myVAILLANT account</legend>
    <p class="homey-subtitle" id="provider-hint">
        Provider can be changed in the app settings (Vaillant or Saunier Duval).
    </p>

    <div class="homey-form-group">
        <label class="homey-form-label" for="country">Select your country</label>
        <select class="homey-form-select" name="country" id="country"></select>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="username">Email</label>
        <input class="homey-form-input" id="username" type="text" value=""/>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="password">Password</label>
        <input class="homey-form-input" id="password" type="password" value=""/>
    </div>
</fieldset>

<button type="button" id="save" class="homey-button-primary-full" disabled>Login</button>

<script type="text/javascript">
  var legendElement = document.getElementById('legend');
  var logoElement = document.getElementById('logo');
  var countryElement = document.getElementById('country');
  var usernameElement = document.getElementById('username');
  var passwordElement = document.getElementById('password');
  var saveElement = document.getElementById('save');
  var providerName = 'Vaillant';
  var providerAppName = 'myVAILLANT';

  Homey.emit('getProvider')
    .then(function(provider) {
      providerName = provider.name;
      providerAppName = provider.appName;
      legendElement.textContent = 'Login with your ' + provider.appName + ' (' + provider.name + ') account';
      logoElement.alt = provider.name;
      if (provider.id !== 'vaillant') {
        logoElement.style.display = 'none';
      }

      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select your country';
      placeholder.disabled = true;
      placeholder.selected = true;
      countryElement.appendChild(placeholder);

      provider.countries.forEach(function(country) {
        var option = document.createElement('option');
        option.value = country.id;
        option.textContent = country.name;
        if (country.id === provider.country) {
          option.selected = true;
        }
        countryElement.appendChild(option);
      });

      saveElement.disabled = false;
    })
    .catch(function(error) {
      Homey.alert('Could not load provider: ' + (error && error.message ? error.message : error));
    });

  function setFormEnabled(enabled) {
    if (enabled) {
      saveElement.classList.remove('is-loading');
    } else {
      saveElement.classList.add('is-loading');
    }
    saveElement.disabled = !enabled;
    countryElement.disabled = !enabled;
    usernameElement.disabled = !enabled;
    passwordElement.disabled = !enabled;
  }

  saveElement.addEventListener('click', function() {
    if (!countryElement.value) {
      return Homey.alert('Please select your country.');
    }

    setFormEnabled(false);

    Homey.emit('login', {
      country: countryElement.value,
      username: usernameElement.value,
      password: passwordElement.value
    })
      .then(function(isLoggedIn) {
        if (isLoggedIn === false) {
          setFormEnabled(true);
          return Homey.alert('Failed to login to your ' + providerAppName + ' (' + providerName + ') account, check your credentials, country and the provider selected in the app settings.');
        }
      })
      .catch(function(error) {
        setFormEnabled(true);
        Homey.alert('Login failed: ' + (error && error.message ? error.message : error));
      });
  });
</script>
</body>
</html>
