name: Update & Publish Homey App
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: 'Changelog entries, comma-separated, e.g. "fix bug a, add feature b"'
        required: true

# Needed in order to push the commit, create a release, and publish the app
permissions:
  contents: write

jobs:
  update_version:
    name: Update Homey App Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.update_app_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Format changelog
        id: format_changelog
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          items=$(printf '%s\n' "$CHANGELOG_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*-[[:space:]]*//;s/^[[:space:]]*//;s/[[:space:]]*$//')
          items=$(printf '%s\n' "$items" | sed '/^[[:space:]]*$/d')

          bullet=$(printf '%s\n' "$items" | sed 's/^/- /')
          inline=$(printf '%s\n' "$items" | paste -sd ',' - | sed 's/,/, /g')

          {
            echo 'bullet<<EOF'
            printf '%s\n' "$bullet"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo 'inline<<EOF'
            printf '%s\n' "$inline"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@master
        id: update_app_version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ steps.format_changelog.outputs.inline }}

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.format_changelog.outputs.bullet }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update Homey App Version to v${{ steps.update_app_version.outputs.version }}"
          git tag "v${{ steps.update_app_version.outputs.version }}"

          git push origin HEAD --tags
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md
          gh release create "v${{ steps.update_app_version.outputs.version }}" -t "v${{ steps.update_app_version.outputs.version }}" --notes-file release_notes.md

  publish:
    name: Publish Homey App
    runs-on: ubuntu-latest
    needs: update_version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures we get all history, including the latest commit

      - name: Pull latest changes
        run: |
          git pull origin master

      - name: Create env.json
        run: |
          echo '{
            "GRAFANA_LOKI_HOST": "${{ secrets.GRAFANA_LOKI_HOST }}",
            "GRAFANA_LOKI_TOKEN": "${{ secrets.GRAFANA_LOKI_TOKEN }}"
          }' > env.json

      - name: Publish Homey App
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: URL
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}." >> $GITHUB_STEP_SUMMARY
